# WHY: Tests must run on every push so regressions are caught before merge.
# Runs on Python 3.9, 3.10, 3.11 to ensure compatibility.
name: CI
on:
  push:
  pull_request:
  workflow_call:  # reused by publish.yml so a release can't skip tests
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check llmcomply tests examples
      - run: pytest --cov=llmcomply --cov-report=xml
